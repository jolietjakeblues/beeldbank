name: 'RCE Beeldbank ETL: harvest + transform + validate + publish'

# Elke zondag 01:00 UTC (= 02:00/03:00 Nederlandse tijd). Handmatig starten kan ook.
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      chunks:
        description: 'Aantal records per JSON-LD-bestand.'
        required: true
        type: number
        default: 7000
      testmode:
        description: 'Testmodus: oogst alleen 100 records per bron en publiceer NIET.'
        required: true
        type: boolean
        default: false
      publish:
        description: 'Publiceer naar de Linked Data Voorziening (alleen zonder testmodus).'
        required: true
        type: boolean
        default: true

env:
  CACHE_PATH: 'data/'
  TRIPLY_ACCOUNT: 'rce'
  TRIPLY_DATASET: 'afbeeldingen'
  TRIPLY_URL: 'https://api.linkeddata.cultureelerfgoed.nl'
  # vaste graphnamen per bron: een nieuwe run vervangt de graph van de vorige run (geen ophoping)
  GRAPH_BASE: 'https://linkeddata.cultureelerfgoed.nl/rce/afbeeldingen/graphs'

# nooit twee runs tegelijk: de tweede zou halverwege de graph van de eerste overschrijven
concurrency:
  group: beeldbank-etl
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Functionele tests en SHACL-tests
        run: python -m pytest

  # Alleen de foto's worden geoogst. Meer bronnen draaien parallel, elk in een eigen job (zie config/config.yml). Gemeten op
  # 13 november 2026: een OAI-pagina met 200 records duurt ongeveer een halve seconde; de foto's (565.000 records, 2.826
  # pagina's) nemen dus naar schatting 45 tot 60 minuten. De time-out laat ruim marge voor een trage bron.
  harvest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        source: [photos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Oogst en transformeer
        env:
          MEMORIX_OAI_KEY: ${{ secrets.MEMORIX_OAI_KEY }}
        run: |
          mkdir -p "${CACHE_PATH}"
          if [ "${{ inputs.testmode }}" = "true" ]; then EXTRA="--max-records 100"; else EXTRA=""; fi
          python src/harvest_service.py --source ${{ matrix.source }} --chunks ${{ inputs.chunks || 7000 }} $EXTRA
      - name: Valideer tegen SHACL (faalt bij een Violation, dan wordt er niets gepubliceerd)
        run: python src/validate_service.py ${CACHE_PATH}${{ matrix.source }}-*.jsonld
      - name: Samenvatting
        if: always()
        run: |
          echo "### ${{ matrix.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "${CACHE_PATH}manifest-${{ matrix.source }}.json" >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: beeldbank-${{ matrix.source }}
          path: ${{ env.CACHE_PATH }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: harvest
    if: ${{ !inputs.testmode && (inputs.publish || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: beeldbank-*
          path: artifacts
      - name: TriplyDB CLI ophalen
        run: |
          wget -q 'https://static.triply.cc/cli/triplydb-linux'
          chmod +x triplydb-linux
      - name: Publiceer per bron naar een vaste graph
        env:
          LDV_API_TOKEN: ${{ secrets.LDV_API_TOKEN }}
        run: |
          set -e
          # download-artifact zet bij een enkele bron de bestanden direct in artifacts/, bij meer bronnen in een submap per bron.
          # De bron volgt daarom uit de bestandsnaam ({bron}-0000.jsonld), niet uit de mapnaam.
          find artifacts -name '*.jsonld' | sort > jsonld-bestanden.txt
          if [ ! -s jsonld-bestanden.txt ]; then
            echo "::error::Geen .jsonld-bestanden gevonden in artifacts/; er is niets te publiceren."
            find artifacts
            exit 1
          fi
          for source in $(sed -E 's#.*/##; s#-[0-9]{4}\.jsonld$##' jsonld-bestanden.txt | sort -u); do
            graph="${GRAPH_BASE}/${source}"
            # eerste bestand vervangt de graph van de vorige run, de rest wordt eraan toegevoegd
            mode=overwrite
            for file in $(grep -E "/${source}-[0-9]{4}\.jsonld$" jsonld-bestanden.txt); do
              echo "Importeer $file in $graph (mode: $mode)"
              ./triplydb-linux import-from-file \
                --dataset "${TRIPLY_DATASET}" --account "${TRIPLY_ACCOUNT}" --url "${TRIPLY_URL}" \
                --token "${LDV_API_TOKEN}" \
                --default-graph-name "${graph}" --mode "${mode}" "$file"
              mode=merge
            done
          done
      - name: Toon Triply-foutmelding
        if: ${{ failure() }}
        run: cat .triplydb-js.err || true

  sync:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Synchroniseer de SPARQL-service
        env:
          LDV_API_TOKEN: ${{ secrets.LDV_API_TOKEN }}
        run: |
          # De dataset heeft (nog) geen eigen SPARQL-service: dan valt er niets te synchroniseren en slaagt deze stap.
          services=$(curl --fail-with-body -sS -H "Authorization: Bearer ${LDV_API_TOKEN}" \
            "${TRIPLY_URL}/datasets/${TRIPLY_ACCOUNT}/${TRIPLY_DATASET}/services")
          echo "Services: ${services}"
          if [ "${services}" = "[]" ]; then
            echo "::notice::Geen SPARQL-service op ${TRIPLY_ACCOUNT}/${TRIPLY_DATASET}, sync overgeslagen."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${LDV_API_TOKEN}" -H 'Content-Type: application/json' \
            "${TRIPLY_URL}/datasets/${TRIPLY_ACCOUNT}/${TRIPLY_DATASET}/services/${TRIPLY_DATASET}" \
            -d '{"sync": "true"}'
